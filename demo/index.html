<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Floorplan Card · Local demo</title>
<style>body{font:16px system-ui;margin:0;background:#eef2f4;color:#26343d}main{max-width:1080px;margin:auto;padding:20px}h1{font-size:24px}section.layout{display:grid;grid-template-columns:minmax(0,540px) minmax(0,1fr);gap:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}summary,button{cursor:pointer;padding:12px}aside{min-width:0}#events{max-height:240px;overflow:auto}@media(max-width:720px){section.layout{grid-template-columns:minmax(0,1fr)}main{padding:12px}}body.dark{--primary-text-color:#e1e9ed;--secondary-text-color:#aebec8;--card-background-color:#202b32;--secondary-background-color:#293740;--divider-color:#43515a;background:#142028;color:#e1e9ed}</style>
<style>floorplan-card{min-width:0}aside{min-width:0}</style><style>body{background:#eff3f0;color:#283f35}main{max-width:1320px;padding:32px}h1{font-size:30px;letter-spacing:-1px;margin:0}main>p{color:#65776d;margin:8px 0 22px}section.layout{grid-template-columns:minmax(0,1.15fr) minmax(330px,1fr);gap:28px;margin-top:24px;align-items:start}aside>details>summary{padding:0 0 15px;font-weight:600;font-size:14px}button{font:500 13px system-ui;min-height:44px;border:1px solid var(--divider-color,#d7e1db);background:var(--card-background-color,#fff);color:inherit;border-radius:9px;padding:10px 14px;margin:0 4px 6px 0}button:hover{box-shadow:0 3px 9px #234b3315}pre{background:var(--card-background-color,#fff);padding:14px;border-radius:10px;border:1px solid var(--divider-color,#d7e1db)}h2{font-size:16px}body.dark{background:#14221e}body.dark main>p{color:#aebec0}a{color:#257d6f}@media(max-width:820px){section.layout{grid-template-columns:minmax(0,1fr)}main{padding:16px}}@media(min-width:821px){section.layout>floorplan-card{min-width:0;position:sticky;top:20px}}</style>
<main><h1>Floorplan Card</h1><p>Fictional example · simulated entities and service calls</p><button id="theme">◐ Toggle theme</button> <button id="presence">Toggle presence</button> <button id="alloff">All lights off</button> <button id="allon">All lights on</button><details><summary>Demo tools</summary><button id="failure">Simulate service failure</button> <button id="restart">Start empty setup</button></details><section class="layout"><floorplan-card></floorplan-card><aside><details open><summary>Edit floorplans and assignments</summary><floorplan-card-editor></floorplan-card-editor></details><details><summary>Service calls</summary><pre id="events">Select a light to begin.</pre></details><details><summary>Demo configuration</summary><pre id="config"></pre></details></aside></section></main>
<script type="module">
import '../dist/hacs-floorplan.js';
const entity=(name,modes,state='on',extra={})=>({state,attributes:{friendly_name:name,supported_color_modes:modes,brightness:180,rgb_color:[255,186,90],...extra}});
const states={'light.diner':entity('Diner',['rgb']), 'light.kitchen':entity('Kitchen',['brightness']), 'light.lounge':entity('Lounge',['color_temp'],'off',{min_color_temp_kelvin:2200,max_color_temp_kelvin:5000,color_temp_kelvin:3000}), 'light.utility':entity('Utility',['onoff'],'off'), 'light.bedroom':entity('Bedroom',['rgb'],'unavailable'), 'sensor.temperature':{state:'21.4',attributes:{friendly_name:'Temperature',unit_of_measurement:'°C'}}};
states['binary_sensor.motion']={state:'on',attributes:{friendly_name:'Kitchen presence',device_class:'occupancy'}};
let fail=false;
const card=document.querySelector('floorplan-card'), editor=document.querySelector('floorplan-card-editor');
let config={type:'custom:floorplan-card',title:'Example home',floors:[{id:'example',name:'Example floor',image:'/demo/sample.svg',entities:[{entity:'light.diner',x:25,y:25},{entity:'light.kitchen',x:70,y:25},{entity:'light.utility',x:75,y:75},{entity:'light.lounge',x:25,y:65},{entity:'sensor.temperature',x:25,y:85}]}],groups:[{name:'All lights',entities:['light.diner','light.kitchen','light.lounge','light.utility']},{name:'Kitchen & diner',entities:['light.diner','light.kitchen']}]};
config.floors[0].rooms=[{id:'kitchen',name:'Kitchen & diner',points:[[5,5],[95,5],[95,45],[5,45]],lights:['light.kitchen','light.diner'],presence:['binary_sensor.motion']},{id:'lounge',name:'Lounge',points:[[5,45],[50,45],[50,95],[5,95]],lights:['light.lounge'],presence:[]}];
config.appearance={mode:'clean',furniture_opacity:.7};
config.floors[0].aspect_ratio=1;config.floors[0].width_m=10;
config.floors[0].rooms.push({id:'utility',name:'Utility',points:[[50,45],[95,45],[95,95],[50,95]],lights:['light.utility'],presence:[]});
config.floors[0].walls=[[[5,5],[95,5]],[[95,5],[95,95]],[[95,95],[5,95]],[[5,95],[5,5]],[[5,45],[95,45]],[[50,45],[50,95]]].map(([a,b],i)=>({id:`wall-${i}`,a,b,openings:i<2?[{id:`window-${i}`,type:'window',offset:.5,width:2,height:1.2,sill:.9}]:i>3?[{id:`door-${i}`,type:'door',offset:.5,width:1,height:2.1,sill:0}]:[]}));
config.floors[0].objects=[['dining_table',26,25,1.7,.9],['chair',26,16,.45,.5],['chair',26,34,.45,.5],['chair',16,25,.45,.5],['chair',36,25,.45,.5],['kitchen_unit',67,10,3.3,.6],['sink',67,10,.55,.4],['fridge',90,11,.65,.7],['island',73,30,1.8,.8],['sofa',26,52,2.3,.9],['rug',26,70,2.2,1.8],['tv_bench',26,91,1.7,.4],['tv',26,91,1.2,.1],['plant',10,88,.5,.5],['side_table',43,53,.5,.5],['desk',75,88,1.6,.65],['office_chair',75,78,.65,.65],['bookshelf',91,67,.8,.35]].map(([type,x,y,width,depth],i)=>({id:`furniture-${i}`,type,x,y,width,depth,rotation:0}));
const hass={states,async callService(domain,service,data){
  document.querySelector('#events').textContent=JSON.stringify({domain,service,data},null,2)+'\n'+document.querySelector('#events').textContent;
  if(fail){fail=false;throw Error('Demo failure');}
  for(const id of data.entity_id){
    states[id]={...states[id],state:service==='turn_off'?'off':'on',attributes:{
      ...states[id].attributes,
      ...(data.brightness_pct?{brightness:Math.round(data.brightness_pct*2.55)}:{}),
      ...(data.rgb_color?{rgb_color:data.rgb_color}:{}),
      ...(data.color_temp_kelvin?{color_temp_kelvin:data.color_temp_kelvin}:{})
    }};
  }
  card.hass={...hass};
}};
function update(){card.setConfig(config);card.hass=hass;document.querySelector('#config').textContent=JSON.stringify(config,null,2);}
editor.setConfig(config);editor.hass=hass;editor.addEventListener('config-changed',e=>{config=e.detail.config;update();});
card.addEventListener('hass-more-info',e=>document.querySelector('#events').textContent=`Entity details requested: ${e.detail.entityId}`);
document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');document.querySelector('#failure').onclick=()=>{fail=true;document.querySelector('#events').textContent='Next service call will fail.';};update();
document.querySelector('#presence').onclick=()=>{states['binary_sensor.motion'].state=states['binary_sensor.motion'].state==='on'?'off':'on';card.hass={...hass};};
for(const [id,value] of [['alloff','off'],['allon','on']])document.querySelector('#'+id).onclick=()=>{for(const [key,state] of Object.entries(states))if(key.startsWith('light.')&&state.state!=='unavailable')state.state=value;card.hass={...hass};};
document.querySelector('#restart').onclick=()=>{config={type:'custom:floorplan-card',title:'Home',floors:[],groups:[]};editor.step=0;editor.setConfig(config);update();};
</script></html>
